<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf2df"><meta name="description" content="바람이 머무는 작은 3D 섬. 모스라이트 마을에서 나만의 느긋한 하루를 보내세요."><title>모스라이트 · 작은 섬의 하루</title></head>
<body>
  <main id="app">
    <div id="scene" aria-label="모스라이트 3D 마을. 방향키로 이동하고 E키로 상호작용하세요."></div>
    <header class="topbar">
      <a class="brand" href="./" aria-label="모스라이트 홈"><span class="brand-mark">✳</span><span>모스라이트<small>MOSSLIGHT ISLAND</small></span></a>
      <div class="island-pill"><span class="dot"></span>바람이 쉬어가는 섬 <span class="divider">|</span><span id="clock">오후의 산책</span></div>
      <nav><button id="photo" class="icon-button" title="사진 저장" aria-label="마을 사진 저장">▧</button><button id="settings" class="icon-button" title="설정" aria-label="여행자 설정">⚙</button></nav>
    </header>
    <section class="welcome"><div class="eyebrow">YOUR LITTLE GETAWAY</div><h1>오늘은, 느긋하게.</h1><p>작은 발견이 기다리는 나만의 섬</p><div class="weather">☀ <span id="weather">포근한 낮</span><span>22°</span></div></section>
    <aside class="right-panel">
      <div class="wallet"><span class="coin">✦</span><span><small>나의 잎사귀</small><strong id="coins">120</strong></span><span class="wallet-leaf">❧</span></div>
      <section class="quest-card"><div class="section-label"><span>섬의 첫 페이지</span><span>✎</span></div><h2>작은 일부터 시작해요</h2><div id="quests"></div><button id="reward" disabled>천천히, 하나씩 <span>→</span></button></section>
      <div class="map-card"><canvas id="minimap" width="180" height="145" aria-label="마을 지도"></canvas><span>모스라이트 안내지도 <b>N ↑</b></span></div>
    </aside>
    <div class="location"><span>⌖</span><div>느티나무 광장<small>어디로 걸어볼까요?</small></div></div>
    <div id="hint" class="interaction" hidden><kbd>E</kbd><span>대화하기</span></div>
    <div id="placement" class="placement" hidden>땅을 눌러 배치하세요 · <kbd>Esc</kbd> 취소</div>
    <footer class="bottom"><div class="controls"><span><kbd>W A S D</kbd> 이동</span><span>드래그 · 시점 회전</span><span>휠 · 확대</span></div><div class="toolbar"><button id="explore" class="tool active"><span>⌘</span>산책</button><button id="bag" class="tool"><span>♧</span>주머니</button><button id="decorate" class="tool"><span>♧</span>꾸미기</button><button id="chat" class="tool"><span>☏</span>이야기</button><button id="day" class="tool"><span>☼</span>낮 / 밤</button></div><div class="connection"><span class="dot"></span><span id="online">혼자만의 산책</span><small id="save-status">자동 저장 중</small></div></footer>
    <div id="touch-controls"><button data-dir="up" aria-label="앞으로">↑</button><div><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="down" aria-label="뒤로">↓</button><button data-dir="right" aria-label="오른쪽">→</button></div><button id="touch-action">이야기 / 수확</button></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="panel"><div class="dialog-head"><div><small id="panel-subtitle">ISLAND LIFE</small><h2 id="panel-title"></h2></div><button id="close-panel" aria-label="창 닫기">✕</button></div><div id="panel-body"></div></dialog>
    <div id="loading"><span>✳</span><h2>작은 섬을 깨우는 중…</h2><p>나무에 햇살을, 바다에 바람을 담고 있어요.</p></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body></html>
